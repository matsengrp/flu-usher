name: historydag

channels:
  - https://prefix.dev/conda-forge
  - https://prefix.dev/matsengrp
  - nodefaults

dependencies:
  # python is held at 3.10 for two independent reasons. Do not bump it because
  # only the first one looks resolved.
  #
  # 1. historydag hits a closure bug under 3.12's changed comprehension scoping.
  #
  # 2. Determinism. trim_dag and create_newick rely on PYTHONHASHSEED=0 to fix
  #    frozenset iteration order (see scripts/trim_dag.py), but that only pins
  #    string hashing *within* a Python minor version. 3.11 switched the string
  #    hash from SipHash-2-4 to SipHash-1-3, so with PYTHONHASHSEED=0 set:
  #        3.10: hash('node_id_12345') ==  2296054884973558965
  #        3.12: hash('node_id_12345') == -9080770603737800786
  #    Bumping this pin therefore changes every tree the pipeline produces,
  #    silently -- nothing errors, the artifacts just stop matching archived
  #    output. Re-derive and re-baseline deliberately if you ever do bump it.
  - python =3.10
  - historydag =1.3.1
